<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Codesketch Capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    import { createRenderer } from '/painting/rendering/index.mjs';

    async function run() {
      try {
        const response = await fetch('/snapshot.json');
        if (!response.ok) throw new Error('Failed to load snapshot: ' + response.status);
        const { document: doc, active, crop, scale } = await response.json();

        const canvas = globalThis.document.getElementById('canvas');
        const renderer = createRenderer(canvas);
        renderer(doc, active);

        let finalCanvas = canvas;
        let outWidth = doc.width;
        let outHeight = doc.height;

        if (crop || (scale && scale !== 1)) {
          const s = scale || 1;
          const c = crop || { x: 0, y: 0, width: doc.width, height: doc.height };
          outWidth = Math.max(1, Math.round(c.width * s));
          outHeight = Math.max(1, Math.round(c.height * s));

          const cropCanvas = globalThis.document.createElement('canvas');
          cropCanvas.width = outWidth;
          cropCanvas.height = outHeight;
          const cropCtx = cropCanvas.getContext('2d');
          cropCtx.imageSmoothingEnabled = true;
          cropCtx.imageSmoothingQuality = 'high';
          cropCtx.drawImage(canvas, c.x, c.y, c.width, c.height, 0, 0, outWidth, outHeight);
          finalCanvas = cropCanvas;
        }

        const dataUrl = finalCanvas.toDataURL('image/png');
        return { dataUrl, width: outWidth, height: outHeight };
      } catch (err) {
        return { error: err.message || String(err) };
      }
    }

    window.__renderPromise = run();
  </script>
</body>
</html>
