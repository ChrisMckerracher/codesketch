    const canvas = document.getElementById('studioCanvas');
    const ctx = canvas.getContext('2d');

    function draw_rect(x, y, w, h, color, opacity = 1.0) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
      ctx.restore();
    }

    function draw_stroke(pts, color, size = 1, opacity = 1.0) {
      if (!pts || pts.length === 0) return;
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i][0], pts[i][1]);
      }
      ctx.stroke();
      ctx.restore();
    }

    function draw_ellipse(cx, cy, rx, ry, color, opacity = 1.0) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx / 2, ry / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function draw_rounded_rect(x, y, w, h, r, color, opacity = 1.0) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
      ctx.restore();
    }

    function draw_text(text, x, y, scale = 1.0, color = "#1E293B", size = 1, opacity = 1.0) {
      let cur_x = x;
      const char_w = 6 * scale;
      const spacing = 2 * scale;
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let char of String(text).toUpperCase()) {
        if (GLYPHS[char]) {
          const paths = GLYPHS[char];
          for (let path of paths) {
            ctx.beginPath();
            const p0x = cur_x + path[0][0] * scale;
            const p0y = y + path[0][1] * scale;
            ctx.moveTo(p0x, p0y);
            if (path.length === 1) {
              ctx.lineTo(p0x + 1, p0y + 1);
            } else {
              for (let i = 1; i < path.length; i++) {
                ctx.lineTo(cur_x + path[i][0] * scale, y + path[i][1] * scale);
              }
            }
            ctx.stroke();
          }
        }
        cur_x += char_w + spacing;
      }
      ctx.restore();
    }

          draw_rect(756, 168 + dy, 228, 2, "#E2E8F0");
          const opRatio = Math.max(0, Math.min(1, state.opacity / 100));

          draw_rect(756, 168 + dy, opFillW, 2, isOpActive ? "#0284C7" : "#94A3B8");
          draw_ellipse(756 + opFillW, 169 + dy, 8, 8, isOpActive ? "#0284C7" : "#94A3B8");

          const isSmActive = state.activeSlider === 'smoothing' || state.hoveredSlider === 'smoothing';

          draw_text(`${state.smoothing}%`, 948, 182 + dy, 0.75, isSmActive ? "#0284C7" : "#64748B", 1);
          draw_rect(756, 194 + dy, 228, 2, "#E2E8F0");
          const smRatio = Math.max(0, Math.min(1, state.smoothing / 100));
          const smFillW = Math.round(smRatio * 228);
          draw_rect(756, 194 + dy, smFillW, 2, isSmActive ? "#0284C7" : "#94A3B8");
          draw_ellipse(756 + smFillW, 195 + dy, 8, 8, isSmActive ? "#0284C7" : "#94A3B8");

          draw_text("INK PIGMENT", 756, 208 + dy, 0.75, "#64748B", 1);
          draw_rounded_rect(914, 204 + dy, 70, 18, 3, "#E0F2FE");
          draw_text(state.color.toUpperCase(), 922, 208 + dy, 0.7, "#0284C7", 1);

          for (let i = 0; i < PALETTE.length; i++) {
            const cx_chip = 765 + i * 30;
            const cy_chip = 233 + dy;
            const isSelected = state.color.toUpperCase() === PALETTE[i].toUpperCase();
            if (isSelected) {
              draw_ellipse(cx_chip, cy_chip, 24, 24, "#0284C7");
              draw_ellipse(cx_chip, cy_chip, 20, 20, "#FFFFFF");
            }
            draw_ellipse(cx_chip, cy_chip, 16, 16, PALETTE[i]);
            if (PALETTE[i] === '#FFFFFF') {
              draw_stroke([[cx_chip - 8, cy_chip], [cx_chip + 8, cy_chip]], "#E2E8F0", 1);
            }
          }

          draw_text("LAYERS", 756, 256 + dy, 0.8, "#64748B", 1);
          if (state.hoveredNewLayer) {
            draw_rounded_rect(930, 252 + dy, 56, 18, 3, "#E0F2FE");
            draw_text("+ NEW", 936, 256 + dy, 0.75, "#0369A1", 1);
          } else {
            draw_text("+ NEW", 936, 256 + dy, 0.75, "#0284C7", 1);
          }

          const layerVpY = 272 + dy;
          const layerVpH = 200; // 272 to 472
          let totalLayersH = 0;
          for (let layer of state.layers) {
            totalLayersH += (state.activeLayer === layer.num ? 50 : 30);
          }
          const maxLayerScroll = Math.max(0, totalLayersH - layerVpH);
          state.layerScrollY = Math.max(0, Math.min(maxLayerScroll, state.layerScrollY || 0));

          ctx.save();
          ctx.beginPath();
          ctx.rect(748, layerVpY, 248, layerVpH);
          ctx.clip();

          let ly = 276 + dy - state.layerScrollY;
          for (let layer of state.layers) {
            const isActive = state.activeLayer === layer.num;
            const rowH = isActive ? 50 : 30;

            if (ly + rowH >= layerVpY && ly <= layerVpY + layerVpH) {
              if (isActive) {
                draw_rounded_rect(748, ly - 4, 244, 46, 3, "#F0F9FF");
                draw_rect(748, ly - 4, 3, 46, "#0284C7");
              }
              draw_text(layer.num, 756, ly, 0.85, isActive ? "#0284C7" : "#64748B", 1);
              draw_text(layer.name, 786, ly, 0.85, isActive ? "#0F172A" : "#64748B", 1);
              draw_text(layer.op, 932, ly, 0.75, isActive ? "#0284C7" : "#94A3B8", 1);

              if (layer.vis) {
                draw_ellipse(976, ly + 4, 12, 6, "#64748B");
                draw_ellipse(976, ly + 4, 4, 4, "#FFFFFF");
              } else {
                draw_ellipse(976, ly + 4, 12, 6, "#CBD5E1");
                draw_stroke([[970, ly], [982, ly + 8]], "#94A3B8", 1.5);
              }

              if (isActive) {
                draw_text("OPACITY", 756, ly + 18, 0.65, "#0369A1", 1);
                draw_rect(810, ly + 22, 128, 2, "#E2E8F0");
                const fillW = Math.round((layer.opacityNum / 100) * 128);
                draw_rect(810, ly + 22, fillW, 2, "#0284C7");
                draw_ellipse(810 + fillW, ly + 23, 6, 6, "#0284C7");
              }
            }
            ly += rowH;
          }
          ctx.restore();

          if (totalLayersH > layerVpH) {
            const lTrackTop = 276 + dy;
            const lTrackBottom = 468 + dy;
            const lTrackH = lTrackBottom - lTrackTop;
            const lThumbH = Math.max(20, Math.min(lTrackH - 10, Math.round((layerVpH / totalLayersH) * lTrackH)));
            const lScrollRatio = maxLayerScroll > 0 ? (state.layerScrollY / maxLayerScroll) : 0;
            const lThumbY = lTrackTop + Math.round(lScrollRatio * (lTrackH - lThumbH));
            draw_stroke([[994, lThumbY], [994, lThumbY + lThumbH]], "#94A3B8", 4);
          }

          // Bottom Comments List (Zero-CLS Architecture with Custom Font)
          const isActFilter = (state.commentFilter === 'ACTIVE');
          const isAllFilter = !isActFilter;

            draw_rect(756, 476, 228, 1, "#F1F5F9");
            draw_text("COMMENTS", 756, 494, 0.85, "#0F172A", 1);

            // Dynamic Filter Chiclets
            draw_rounded_rect(836, 488, 32, 16, 3, isAllFilter ? "#0284C7" : "#F1F5F9");
            if (!isAllFilter) draw_rect(836, 488, 32, 1, "#CBD5E1");
            draw_text("24", 844, 491, 0.65, isAllFilter ? "#FFFFFF" : "#64748B", 1);

            draw_rounded_rect(874, 488, 56, 16, 3, isActFilter ? "#0284C7" : "#F1F5F9");
            if (!isActFilter) draw_rect(874, 488, 56, 1, "#CBD5E1");
            draw_text("4 ACTIVE", 880, 491, 0.6, isActFilter ? "#FFFFFF" : "#64748B", 1);

            // Filter comments list
            const filteredComments = isActFilter 
              ? ALL_COMMENTS.filter(c => c.status === 'ACTIVE') 
              : ALL_COMMENTS;

            const vpX = 752, vpY = 514, vpH = 140;
            const itemH = 38;
            const totalContentH = filteredComments.length * itemH;
            const maxScroll = Math.max(0, totalContentH - vpH);
            state.commentScrollY = Math.max(0, Math.min(maxScroll, state.commentScrollY));

            // CLS-Free Invariant: Card width & badge X are strictly pinned in reserved gutter mode
            const cardW = (state.clsMode === 'traditional' && maxScroll > 0) ? 200 : 216;
            const pillX = (state.clsMode === 'traditional' && maxScroll > 0) ? 904 : 920;
            const sx = (state.clsMode === 'traditional' && maxScroll > 0) ? 960 : 994;

            // Clipped Comments Viewport (No scrollbar layout thrashing)
            ctx.save();
            ctx.beginPath();
            ctx.rect(750, vpY, 240, vpH);
            ctx.clip();

            filteredComments.forEach((c, idx) => {
              const cy_c = vpY + 2 + (idx * itemH) - state.commentScrollY;
              if (cy_c + itemH < vpY - 5 || cy_c > vpY + vpH + 5) return; // viewport culling

              const isAct = (c.status === 'ACTIVE');
              const isSelected = (c.frameIdx === state.activeFrameIdx);

              if (isSelected) {
                draw_rounded_rect(752, cy_c - 2, cardW, 35, 3, "#F0F9FF");
                draw_rect(752, cy_c - 2, 3, 35, "#0284C7");
              } else {
                draw_rect(756, cy_c + 35, cardW - 8, 1, "#F8FAFC");
              }

              draw_ellipse(760, cy_c + 4, 8, 8, isAct ? "#0284C7" : "#94A3B8");
              draw_text(`#${c.num} ${c.label}`, 774, cy_c + 2, 0.65, isSelected ? "#0F172A" : (isAct ? "#1E293B" : "#64748B"), 1);
              
              draw_rounded_rect(pillX, cy_c, 44, 15, 2, isAct ? "#E0F2FE" : "#F1F5F9");
              draw_text(isAct ? "ACTIVE" : "ACK", pillX + (isAct ? 6 : 12), cy_c + 3, 0.52, isAct ? "#0284C7" : "#64748B", 1);
              draw_text(c.bounds, 774, cy_c + 16, 0.52, "#64748B", 1);
            });
            ctx.restore();

            // Scrollbar Track & Paint Stroke Thumb (Floating in Reserved 24px Gutter)
            const trackTop = 518;
            const trackBottom = 650;
            const trackH = trackBottom - trackTop; // 132px

            if (totalContentH > vpH) {
              const thumbH = Math.max(26, Math.min(trackH - 10, Math.round((vpH / totalContentH) * trackH)));
              const scrollRatio = maxScroll > 0 ? (state.commentScrollY / maxScroll) : 0;
              const thumbY = trackTop + Math.round(scrollRatio * (trackH - thumbH));

              if (state.perspective === 'paint_stroke') {
                // Pure floating rounded paint stroke (single stroke, natural round ends) - matching layers scrollbar
                draw_stroke([[sx, thumbY], [sx, thumbY + thumbH]], "#94A3B8", 4);

              } else if (state.perspective === 'paint_stroke_soft') {
                // Rounded paint stroke with faint soft guide line
                draw_stroke([[sx, trackTop], [sx, trackBottom]], "#F1F5F9", 2);
                draw_stroke([[sx, thumbY], [sx, thumbY + thumbH]], "#94A3B8", 4);

              } else if (state.perspective === 'paint_stroke_cobalt') {
                // Cobalt blue paint stroke matching active canvas lineart
                draw_stroke([[sx, trackTop], [sx, trackBottom]], "#F1F5F9", 2);
                draw_stroke([[sx, thumbY], [sx, thumbY + thumbH]], "#2563EB", 4);

              } else if (state.perspective === 'wireframe_box') {
                draw_rounded_rect(sx - 4, trackTop, 8, trackH, 2, "#F8FAFC");
                draw_rect(sx - 4, trackTop, 8, 1, "#CBD5E1");
                draw_rect(sx - 4, trackBottom, 8, 1, "#CBD5E1");
                draw_rect(sx - 4, trackTop, 1, trackH, "#CBD5E1");
                draw_rect(sx + 3, trackTop, 1, trackH, "#CBD5E1");
                draw_rounded_rect(sx - 3, thumbY, 6, thumbH, 1, "#94A3B8");
              } else if (state.perspective === 'slider_knob') {
                draw_rect(sx - 1, trackTop, 2, trackH, "#E2E8F0");
                draw_ellipse(sx - 4, thumbY + Math.round(thumbH / 2) - 4, 8, 8, "#0284C7");
                draw_ellipse(sx - 2, thumbY + Math.round(thumbH / 2) - 2, 4, 4, "#FFFFFF");
              }
            } else {
              // Dormant state: If fits without scroll, maintain stable guide line in soft/cobalt modes
              if (state.perspective === 'paint_stroke_soft' || state.perspective === 'paint_stroke_cobalt') {
                draw_stroke([[sx, trackTop], [sx, trackBottom]], "#F8FAFC", 2, 0.4);
              }
            }

            // Bottom Footer in Sidebar (Canvas Mode)
            draw_text("CODESKETCH ENGINE V2", 756, 666, 0.75, "#94A3B8", 1);
            const clsStatusText = (state.clsMode === 'cls_free') ? "CLS 0.0000 STABLE GUTTER" : "CLS 0.0825 LAYOUT SHIFT";
            const clsStatusColor = (state.clsMode === 'cls_free') ? "#10B981" : "#EF4444";
            draw_text(clsStatusText, 756, 678, 0.52, clsStatusColor, 1);
            buildCommentsUI();
        }

      // 4. COLOR PICKER POPOVER (When open)
      if (state.colorPickerOpen && !state.collapsed) {
        const px = 476, py = 168, pw = 248, ph = 216;

        // Shadow & Body
        draw_rounded_rect(px + 3, py + 3, pw, ph, 6, "rgba(0,0,0,0.25)");
        draw_rounded_rect(px, py, pw, ph, 6, "#FFFFFF");
        draw_rect(px, py, pw, 1, "#CBD5E1");
        draw_rect(px, py, 1, ph, "#CBD5E1");
        draw_rect(px + pw - 1, py, 1, ph, "#CBD5E1");
        draw_rect(px, py + ph - 1, pw, 1, "#CBD5E1");

        // Header
        draw_rounded_rect(px + 1, py + 1, pw - 2, 28, 5, "#F8FAFC");
        draw_rect(px, py + 28, pw, 1, "#E2E8F0");
        draw_rounded_rect(px + 8, py + 5, 94, 18, 3, "#E0F2FE");
        draw_text("COLOR PICKER", px + 14, py + 9, 0.65, "#0284C7", 1);
        draw_text("X", px + pw - 18, py + 8, 0.75, "#94A3B8", 1);

        // 2D Saturation/Value Spectrum Field
        const fx = px + 10, fy = py + 34, fw = 228, fh = 62;
        const colW = Math.floor(fw / 6);
        const rowH = Math.floor(fh / 4);
        const satValMatrix = [
          ["#DBEAFE", "#93C5FD", "#60A5FA", "#3B82F6", "#2563EB", "#1D4ED8"],
          ["#BFDBFE", "#60A5FA", "#3B82F6", "#2563EB", "#1D4ED8", "#1E40AF"],
          ["#93C5FD", "#3B82F6", "#2563EB", "#1D4ED8", "#1E40AF", "#172554"],
          ["#60A5FA", "#2563EB", "#1D4ED8", "#1E40AF", "#172554", "#020617"]
        ];
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 6; c++) {
            draw_rect(fx + c * colW, fy + r * rowH, colW, rowH, satValMatrix[r][c]);
          }
        }
        for (let c = 0; c <= 6; c++) {
          draw_rect(fx + c * colW, fy, 1, fh, "#FFFFFF", 0.4);
        }
        for (let r = 0; r <= 4; r++) {
          draw_rect(fx, fy + r * rowH, fw, 1, "#FFFFFF", 0.4);
        }

        // Crosshair Reticle in Picker Field
        const retX = fx + Math.round((state.pickerSat / 100) * fw);
        const retY = fy + Math.round((1 - state.pickerVal / 100) * fh);
        draw_ellipse(retX, retY, 12, 12, "#FFFFFF");
        draw_ellipse(retX, retY, 8, 8, "#0F172A");
        draw_stroke([[retX - 8, retY], [retX + 8, retY]], "#FFFFFF", 1);
        draw_stroke([[retX, retY - 8], [retX, retY + 8]], "#FFFFFF", 1);

        // 1D Hue Spectrum Slider
        const hx = px + 10, hy = py + 100, hw = 228, hh = 12;
        const HUE_COLORS = ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#00FFFF", "#0000FF", "#8B00FF", "#FF007F", "#FF0000"];
        const segW = hw / (HUE_COLORS.length - 1);
        for (let i = 0; i < HUE_COLORS.length - 1; i++) {
          const grad = ctx.createLinearGradient(hx + i * segW, 0, hx + (i + 1) * segW, 0);
          grad.addColorStop(0, HUE_COLORS[i]);
          grad.addColorStop(1, HUE_COLORS[i + 1]);
          ctx.save();
          ctx.fillStyle = grad;
          ctx.fillRect(hx + i * segW, hy, segW + 1, hh);
          ctx.restore();
        }
        const hueThumbX = hx + Math.round((state.pickerHue / 360) * hw);
        const isHueActive = state.activeSlider === 'hue' || state.hoveredSlider === 'hue';
        draw_ellipse(hueThumbX, hy + 6, 12, 12, isHueActive ? "#0284C7" : "#FFFFFF");
        ctx.save();
        ctx.strokeStyle = isHueActive ? "#FFFFFF" : "#0F172A";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(hueThumbX, hy + 6, 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Tool Row: [ PICK ] Eyedropper, Hex Code Field, [ NEW ] Swatch
        const ey = py + 118;
        // [ PICK ] Button (Exact button approved by user)
        draw_rounded_rect(px + 10, ey, 56, 24, 3, state.eyedropperActive ? "#0284C7" : "#F0F9FF");
        draw_rect(px + 10, ey, 56, 1, "#BAE6FD");
        draw_text("PICK", px + 22, ey + 6, 0.7, state.eyedropperActive ? "#FFFFFF" : "#0284C7", 1);

        // Hex Code Display
        draw_rounded_rect(px + 72, ey, 90, 24, 3, "#F8FAFC");
        draw_rect(px + 72, ey, 90, 1, "#CBD5E1");
        draw_text(state.pickerColor.toUpperCase(), px + 80, ey + 6, 0.7, "#0F172A", 1);
        draw_stroke([[px + 138, ey + 4], [px + 138, ey + 20]], "#0284C7", 1);

        // New Swatch Preview
        draw_rounded_rect(px + 168, ey, 70, 24, 3, state.pickerColor);
        draw_text("NEW", px + 190, ey + 6, 0.7, "#FFFFFF", 1);

        // Primary Action: [ APPLY PIGMENT ]
        draw_rounded_rect(px + 10, py + 150, 228, 26, 3, "#0284C7");
        draw_text("APPLY PIGMENT", px + 68, py + 156, 0.75, "#FFFFFF", 1);

        // Recent Mixes Swatches
        draw_text("RECENT", px + 10, py + 186, 0.65, "#94A3B8", 1);
        for (let i = 0; i < state.recentMixes.length; i++) {
          const rx_chip = px + 68 + i * 28;
          draw_ellipse(rx_chip, py + 190, 14, 14, state.recentMixes[i]);
        }
      }

      // 5. LOUPE (When sampling canvas)
      if (state.eyedropperActive && state.loupePos) {
        const lx = state.loupePos.x, ly = state.loupePos.y;
        draw_ellipse(lx, ly, 28, 28, "#FFFFFF");
        draw_ellipse(lx, ly, 24, 24, state.loupeColor);
        draw_stroke([[lx - 16, ly], [lx + 16, ly]], "#FFFFFF", 1);
        draw_stroke([[lx, ly - 16], [lx, ly + 16]], "#FFFFFF", 1);
        draw_rounded_rect(lx - 24, ly + 18, 48, 14, 2, "#1E293B");
        draw_text(state.loupeColor.toUpperCase(), lx - 20, ly + 20, 0.5, "#FFFFFF", 1);
      }
    }
  }

    // Dynamic Comments UI in Sidebar (Synchronized with CLS-Free Scrolling)
    function buildCommentsUI() {
      const cont = document.getElementById('commentsTouchContainer');
      if (!cont) return;
      cont.innerHTML = '';
      const isAct = state.commentFilter === 'ACTIVE';
      const filteredList = isAct ? ALL_COMMENTS.filter(c => c.status === 'ACTIVE') : ALL_COMMENTS;
      const vpY = 514, vpH = 140;
      const actualCardW = (state.clsMode === 'traditional' && filteredList.length * 38 > vpH) ? 200 : 216;

      filteredList.forEach((c, idx) => {
        const cy = vpY + 2 + (idx * 38) - state.commentScrollY;
        // Only active hotspots within visible viewport
        if (cy + 34 < vpY || cy > vpY + vpH) return;

        const btn = document.createElement('button');
        btn.className = 'interactive-btn';
        btn.style.top = (cy - 2) + 'px';
        btn.style.left = '752px';
        btn.style.width = actualCardW + 'px';
        btn.style.height = '35px';
        btn.title = `#${c.num} ${c.label} (${c.status}) — Bounds: ${c.bounds}`;
        btn.onclick = () => {
          if (c.frameIdx >= 0 && c.frameIdx < ALL_FRAMES.length) {
            state.activeFrameIdx = c.frameIdx;
            const f = ALL_FRAMES[c.frameIdx];
            state.marqueeX = f.bounds[0];
            state.marqueeY = f.bounds[1];
            state.marqueeW = f.bounds[2];
            state.marqueeH = f.bounds[3];
            state.composerX = Math.min(740 - 250, state.marqueeX + state.marqueeW + 12);
            state.composerY = state.marqueeY - 4;
            syncButtonPositions();
          }
          renderStudio();
        };
        cont.appendChild(btn);
      });
    }

    window.switchPerspective = function(p) {
      state.perspective = p;
      ['btnPaint', 'btnSoft', 'btnCobalt', 'btnP1'].forEach(id => {
        const b = document.getElementById(id);
        if (!b) return;
        b.style.background = '#1E293B';
        b.style.color = '#94A3B8';
        b.style.border = '1px solid #334155';
      });
      const activeMap = {
        'paint_stroke': 'btnPaint',
        'paint_stroke_soft': 'btnSoft',
        'paint_stroke_cobalt': 'btnCobalt',
        'dedicated_feedback': 'btnP1'
      };
      if (activeMap[p]) {
        const ab = document.getElementById(activeMap[p]);

    function hsvToHex(h, s, v) {
      s /= 100; v /= 100;
      const c = v * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = v - c;
      let r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; b = 0; }
      else if (h < 120) { r = x; g = c; b = 0; }
      else if (h < 180) { r = 0; g = c; b = x; }
      else if (h < 240) { r = 0; g = x; b = c; }
      else if (h < 300) { r = x; g = 0; b = c; }
      else { r = c; g = 0; b = x; }
      const toHex = (n) => {
        const hx = Math.round((n + m) * 255).toString(16).toUpperCase();
        return hx.length === 1 ? '0' + hx : hx;
      };
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

      if (state.feedbackOpen && x >= state.marqueeX && x <= state.marqueeX + state.marqueeW && y >= state.marqueeY && y <= state.marqueeY + state.marqueeH) {
        // Only if not clicking inside comment card
        const cx = state.composerX, cy = state.composerY;

      const strokeSize = state.activeTool === 'ERASE' ? state.size * 2 : state.size;

      if (state.eyedropperActive) {

      if (isDraggingMarquee) {

        renderStudio();
        return;

      if (!isDrawing || !currentStroke) return;

        const trackTop = 518;

        const rect = canvas.getBoundingClientRect();
        const clickY = e.clientY - rect.top;

        const updateFromPointer = (clientY) => {

          state.commentScrollY = Math.round(ratio * maxScroll);

        updateFromPointer(e.clientY);

          window.removeEventListener('pointermove', onPointerMove);

        state.marqueeH = f.bounds[3];
        state.composerX = Math.min(740 - 250, state.marqueeX + state.marqueeW + 12);
        state.composerY = state.marqueeY - 4;
        syncButtonPositions();
        renderStudio();
      };
    }

    syncButtonPositions();
    updateClsMetric();
    renderStudio();

  </script>
